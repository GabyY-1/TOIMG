<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101114"><title>TOIMG — Convertisseur d'images</title>
<link rel="stylesheet" href="style.css">
<script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<section id="png" class="panel">
<div class="grid"><div>
<h2>Importer plusieurs SVG</h2>
<div class="drop" id="drop"><i data-lucide="upload-cloud"></i><strong>Choisir des fichiers SVG</strong><p>Ou glisser-déposer plusieurs fichiers ici</p></div>
<input type="file" id="file" accept=".svg,image/svg+xml" multiple hidden>
<p class="status" id="file-status" aria-live="polite">Aucun fichier sélectionné.</p><ul class="file-list" id="file-list"></ul>

<label for="background">Fond</label>
<select id="background"><option value="transparent">Transparent</option><option value="white">Blanc</option><option value="black">Noir</option></select>
<div class="buttons"><button class="primary" id="export" disabled><i data-lucide="archive"></i> Convertir tout et télécharger le ZIP</button></div>
<p class="status" id="status" aria-live="polite"></p>
</div><div><h2>Aperçu</h2><div class="preview" id="preview"><span class="placeholder">Votre image apparaît ici</span></div></div></div>
</section>
</div>
<script src="script.js" defer></script>
</body></html>
